name: Build desktop installers (not a public release)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "src-tauri/**", "crates/**", "content/**", "Cargo.lock", "package-lock.json", ".github/workflows/desktop.yml"]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
          - os: windows-latest
            bundle: nsis
          - os: macos-latest
            bundle: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - run: npm run validate && npm test && cargo test -p spanish321-core --locked
      - run: npm run tauri -- build --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: spanish321-${{ matrix.os }}-installer-build
          path: target/release/bundle/
